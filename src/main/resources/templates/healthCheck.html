<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>健康診断アプリ</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header>
      <h1>健康診断アプリ</h1>
    </header>

    <div id="main_container">
      <main>
        <h2>BMIをチェックします</h2>
        <p>あなたの身長、体重を入力し、診断ボタンを押してください。</p>
        <div class="container">
          <form th:action="@{/HealthCheck}" method="post">
            身長：
            <input type="text" name="height" th:value="${height}" />
            (cm)
            <span style="color: red" th:text="${heightError}"></span>
            <br />
            体重：
            <input type="text" name="weight" th:value="${weight}" />
            (kg)
            <span style="color: red" th:text="${weightError}"></span>
            <br />
            <p style="color: red" th:text="${errorMessage}"></p>
            <div id="diagnosis_button">
              <input type="submit" value="診断" />
            </div>
          </form>
          <p>
            BMI (Body Mass Index) は、体重(kg) ÷ 身長(m)²
            によって算出される、肥満度の国際的な指標です。
          </p>
        </div>
      </main>
    </div>

    <footer>
      <div><a th:href="@{/HealthCheck}">トップページ</a></div>
    </footer>
  </body>
</html>
